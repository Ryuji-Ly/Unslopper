<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Novel De-slopper</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 12px; }
    button { margin-top: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    p.status { font-size: 12px; margin-top: 8px; min-height: 14px; }
    p.hint { font-size: 11px; color: #888; margin-top: 12px; line-height: 1.4; }
    code { background: #f0f0f0; padding: 1px 3px; border-radius: 3px; }
  </style>
</head>
<body>
  <label for="path">Local output folder (file:// URL)</label>
  <input id="path" type="text"
    placeholder="file:///C:/Users/you/Documents/Projects/Unslopper/output">
  <button id="save" type="button">Save</button>
  <p class="status" id="status"></p>
  <p class="hint">
    Must point at the <code>output</code> folder produced by
    <code>batch-rewrite.js</code> (the one containing <code>index.json</code>).
    Requires "Allow access to file URLs" enabled for this extension at
    chrome://extensions.
  </p>
  <script src="popup.js"></script>
</body>
</html>
